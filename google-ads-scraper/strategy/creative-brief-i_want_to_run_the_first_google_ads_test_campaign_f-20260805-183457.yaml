campaign: "Aagman Waitlist Spike \u2014 Google Ads Test #1"
objective: "Drive a measurable spike in waitlist signups via the first Google Ads\
  \ test, leading with proof-and-execution positioning (idea \u2192 backtest \u2192\
  \ approval-gated deployment) that neither competitor occupies."
audience: "Active Indian retail F&O and equity traders (implied by the Draconic/Tradomate\
  \ competitor set \u2014 ICP is unconfirmed in the brief; if the primary audience\
  \ is long-term investors, variant prioritization must be redone and the investor\
  \ angle promoted to lead)"
success_metric: "Waitlist signup volume vs. current baseline \u2014 AMBIGUOUS: no\
  \ numeric target, CPL ceiling, or timeframe is defined, and no baseline waitlist\
  \ number exists to measure the 'spike' against. Recommend setting a signup target\
  \ and max cost-per-signup before launch."
competitive_intel: "The category is saturated with 'AI second opinion' positioning\
  \ (Draconic, ~90% of inventory), screener-led SEO harvesting (Tradomate), and generic\
  \ 'free signup' friction hooks \u2014 entering these head-on means paying auction\
  \ premiums for undifferentiated copy. Ownable gaps with verified capabilities: proof-first\
  \ workflow (backtest \u2192 paper \u2192 live), institutional execution actually\
  \ shipped (TWAP/VWAP, MIT/LIT/MTL, 4-leg multi-leg options), approval-gated execution\
  \ with capital staying at the user's broker, and verifiable SEBI IA + NSE Whitebox\
  \ empanelment credentials no competitor can claim. The universal conversion layer\
  \ is 'free in beta, no credit card, early users lock legacy rates forever' \u2014\
  \ a concrete urgency hook that undercuts Tradomate's \u20B9249/month push."
variants:
- id: v1
  angle: "Plain words to backtest \u2014 no code"
  persona: Active Indian retail trader with strategy ideas but no Python/Excel quant
    skills (implied ICP, unconfirmed)
  hook_direction: "Lead with the category-creating mechanic: type a trading idea in\
    \ plain words, get a backtest report \u2014 no Python, no Excel, no code. Target\
    \ 'backtest trading strategy India' Search intent; position Aagman as the only\
    \ tool that takes an idea to evidence, not just analysis."
  cta: "Join the waitlist \u2014 free while in beta, no credit card. Early users lock\
    \ legacy rates forever."
  claim_refs:
  - Section 1 (natural-language workspace)
  - Section 6.1 (prompt grammar)
  - "Section 16 \u2014 Backtesting row (Yes)"
  formats:
  - google_rsa
