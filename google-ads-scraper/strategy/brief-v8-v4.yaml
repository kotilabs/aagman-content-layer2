campaign: 'Aagman Waitlist Spike — Google Ads Test #1'
objective: Drive a measurable spike in waitlist signups via the first Google Ads test,
  leading with proof-and-execution positioning (idea → backtest → approval-gated deployment)
  that neither competitor occupies.
audience: Active Indian retail F&O and equity traders (implied by the Draconic/Tradomate
  competitor set — ICP is unconfirmed in the brief; if the primary audience is long-term
  investors, variant prioritization must be redone and the investor angle promoted
  to lead)
success_metric: 'Waitlist signup volume vs. current baseline — AMBIGUOUS: no numeric
  target, CPL ceiling, or timeframe is defined, and no baseline waitlist number exists
  to measure the ''spike'' against. Recommend setting a signup target and max cost-per-signup
  before launch.'
competitive_intel: 'The category is saturated with ''AI second opinion'' positioning
  (Draconic, ~90% of inventory), screener-led SEO harvesting (Tradomate), and generic
  ''free signup'' friction hooks — entering these head-on means paying auction premiums
  for undifferentiated copy. Ownable gaps with verified capabilities: proof-first
  workflow (backtest → paper → live), institutional execution actually shipped (TWAP/VWAP,
  MIT/LIT/MTL, 4-leg multi-leg options), approval-gated execution with capital staying
  at the user''s broker, and verifiable SEBI IA + NSE Whitebox empanelment credentials
  no competitor can claim.'
cross_variant_proof_lines:
- SEBI-registered Investment Adviser + NSE-empanelled Whitebox algo provider
- Type your idea in English, Hindi, Hinglish, or the language you think in
- An AI trading team that builds, backtests, and executes — all approval-gated
variants:
- id: v4
  angle: Institutional execution for retail traders — talk to the desk in your language
  persona: Active Indian retail trader who wants institutional-grade execution without
    an institutional desk (implied ICP, unconfirmed)
  hook_direction: 'Lead with the desk metaphor: ''Trade Like an FII Desk'', ''Algos
    Your Broker App Hides'', ''Institutional Algos for Retail''. The shift is that
    the user describes the order in plain language (English, Hindi, Hinglish) and
    Aagman runs the algo. Do NOT lead headlines with TWAP, VWAP, Iceberg, or POV.
    Those specific algo names should appear only 2-3 times across the descriptions
    (subheadlines), not as the primary headline hook. The main story is: retail traders
    now get the execution desk big institutions use, controlled by typing or speaking
    naturally.'
  cta: See the algos live
  claim_refs:
  - Section 7.1 (execution algorithms — TWAP/VWAP live; MIT/LIT/MTL)
  - Section 7.2 (retail broker comparison)
  - Section 16 — TWAP/VWAP row (Yes)
  formats:
  - google_rsa
