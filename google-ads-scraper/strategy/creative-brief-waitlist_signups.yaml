campaign: "Aagman Waitlist Launch \u2014 Phase 1 Experimentation Sprint"
objective: Drive 500 verified (double opt-in confirmed) waitlist signups in 6 weeks
  while identifying the cheapest-converting segment and messaging angle to inform
  Q2 scaling.
audience: "Three test segments from source-of-truth personas: S1 \u2014 active NIFTY/BANKNIFTY\
  \ F&O traders on Zerodha/Dhan frustrated by limited order types (45% of test budget);\
  \ S2 \u2014 rule-based retail traders without coding skills (35%); S3 \u2014 long-term\
  \ quality-stock investors and screener users (20%). Excluded: MF-only buyers, multi-language-first\
  \ users (Phase 2), crypto/forex/international audiences."
success_metric: 500 verified waitlist signups at blended CPA <= Rs.150; pause any
  ad group with CPA > Rs.250 after ~Rs.3,000 spend; minimum Rs.5,000 spend per test
  cell before judging; track signup-to-activation as secondary quality signal.
